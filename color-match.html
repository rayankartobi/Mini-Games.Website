<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="4style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match</title>
</head>
<body>
    <a href="main.html" class="top-button">Back to Hub</a>
  <h1>Color Match</h1>
  <p>Pick the color that matches this code:</p>
  <div id="color-code">#??????</div>
  <div class="colors" id="colors-container"></div>
  <div id="message"></div>

  <script>
    let gameOver = false;

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function generateGame() {
      const correctColor = getRandomColor();
      document.getElementById('color-code').textContent = correctColor;

      const colors = [correctColor];
      while (colors.length < 3) {
        const newColor = getRandomColor();
        if (!colors.includes(newColor)) {
          colors.push(newColor);
        }
      }

      shuffle(colors);

      const container = document.getElementById('colors-container');
      container.innerHTML = '';

      colors.forEach(color => {
        const box = document.createElement('div');
        box.classList.add('color-box');
        box.style.backgroundColor = color;
        box.addEventListener('click', () => {
          if (gameOver) return;
          gameOver = true;

          if (color === correctColor) {
            document.getElementById('message').textContent = '🎉 Correct! Reloading...';
            setTimeout(() => location.reload(), 500);
          } else {
            document.getElementById('message').textContent = '❌ Wrong! Reloading...';
            setTimeout(() => location.reload(), 500);
          }
        });
        container.appendChild(box);
      });
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    generateGame();
  </script>
</body>
</html>
